<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" role="img" aria-labelledby="title desc">
<title id="title">副本与引用指向不同的对象关系</title><desc id="desc">score 和 alias 指向同一个值为5的整数，copy 是独立的值为8的整数。这是示例第二次输出的时刻。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#365d88"/></marker></defs>
<rect width="800" height="370" fill="#f7f9fc"/><g font-family="system-ui, PingFang SC, sans-serif"><text x="28" y="38" font-size="23" fill="#25364a" font-weight="650">两个名字可以操作同一个对象</text><text x="28" y="68" font-size="16" fill="#25364a" >时刻：copy = 8; alias = 5; 已执行，尚未执行 alias = other</text><rect x="40" y="105" width="170" height="56" rx="8" fill="#edf2f8" stroke="#7996b9"/><text x="125" y="140" font-size="21" fill="#25364a" text-anchor="middle">score</text><rect x="40" y="195" width="170" height="56" rx="8" fill="#edf2f8" stroke="#7996b9"/><text x="125" y="230" font-size="21" fill="#25364a" text-anchor="middle">alias</text><rect x="330" y="140" width="160" height="100" rx="8" fill="#dce9f7" stroke="#7996b9"/><text x="410" y="176" font-size="17" fill="#25364a" text-anchor="middle">同一个整数</text><text x="410" y="218" font-size="32" fill="#25364a" text-anchor="middle">5</text><path d="M210 133 H275 V168 H322" fill="none" stroke="#365d88" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M210 223 H275 V208 H322" fill="none" stroke="#365d88" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="570" y="105" width="175" height="56" rx="8" fill="#edf2f8" stroke="#7996b9"/><text x="657" y="140" font-size="21" fill="#25364a" text-anchor="middle">copy</text><rect x="570" y="195" width="175" height="56" rx="8" fill="#fff3dc" stroke="#b79864"/><text x="657" y="231" font-size="28" fill="#25364a" text-anchor="middle">8</text><path d="M657 161 V187" fill="none" stroke="#365d88" stroke-width="2.5" marker-end="url(#arrow)"/><text x="28" y="300" font-size="18" fill="#25364a" >copy 有自己的整数；alias 没有创建第二份被引用的整数。</text><text x="28" y="336" font-size="17" fill="#25364a" >随后 alias = other 会把值写入 score，alias 仍是 score 的别名。</text></g></svg>