<svg xmlns="http://www.w3.org/2000/svg" width="900" height="475" viewBox="0 0 900 475" role="img" aria-labelledby="title desc"><title id="title">BPE相邻计数与非重叠替换</title><desc id="desc">四个97相邻形成三个候选对。左到右非重叠替换把前两个97与后两个97各变成256，得到两个新词元。三个97则只产生一个256和一个97。</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#233b42} .title{font-size:25px;font-weight:650} .label{font-size:21px} .small{font-size:18px} .mono{font-family:monospace;font-size:20px} .line{fill:none;stroke:#477e80;stroke-width:2.4;marker-end:url(#arrow)} .soft{fill:#eef5f1;stroke:#91b3a6;stroke-width:1.5} .box{fill:#fffef9;stroke:#98adae;stroke-width:1.5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#477e80"/></marker></defs><rect width="900" height="475" rx="16" fill="#f8f7f1"/><text x="30" y="42" class="title" text-anchor="start">aaaa：相邻出现 3 次，本轮只替换 2 处</text><path d="M286 122 Q346 55 406 122" fill="none" stroke="#65869c" stroke-width="2"/><path d="M406 122 Q466 55 526 122" fill="none" stroke="#65869c" stroke-width="2"/><path d="M526 122 Q586 55 646 122" fill="none" stroke="#65869c" stroke-width="2"/><rect x="240" y="130" width="92" height="60" rx="12" class="box"/><text x="286.0" y="162" class="mono" text-anchor="middle">97</text><rect x="360" y="130" width="92" height="60" rx="12" class="box"/><text x="406.0" y="162" class="mono" text-anchor="middle">97</text><rect x="480" y="130" width="92" height="60" rx="12" class="box"/><text x="526.0" y="162" class="mono" text-anchor="middle">97</text><rect x="600" y="130" width="92" height="60" rx="12" class="box"/><text x="646.0" y="162" class="mono" text-anchor="middle">97</text><text x="30" y="157" class="label" text-anchor="start">相邻统计</text><text x="30" y="183" class="small" text-anchor="start">允许重叠</text><rect x="228" y="120" width="236" height="82" rx="14" fill="none" stroke="#6c9d87" stroke-width="2"/><rect x="468" y="120" width="236" height="82" rx="14" fill="none" stroke="#6c9d87" stroke-width="2"/><path d="M346 208 V285" class="line"/><path d="M586 208 V285" class="line"/><text x="30" y="250" class="label" text-anchor="start">非重叠替换</text><text x="30" y="278" class="small" text-anchor="start">每两个旧词元消费一次</text><rect x="286" y="300" width="120" height="65" rx="12" class="soft"/><text x="346.0" y="332" class="mono" text-anchor="middle">256</text><rect x="526" y="300" width="120" height="65" rx="12" class="soft"/><text x="586.0" y="332" class="mono" text-anchor="middle">256</text><text x="450" y="407" class="small" text-anchor="middle">规则：(97, 97) → 256；同一个旧词元不能参加两次替换。</text><text x="450" y="445" class="small" text-anchor="middle">对 aaa：相邻统计 2 次，但替换结果是 [256, 97]。</text></svg>
