<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 455" role="img" aria-labelledby="title desc">
<title id="title">vector元素数量与预留容量</title><desc id="desc">reserve后没有元素，push_back后有18，resize到3后有18、0、0。剩余预留空间不是可以访问的元素。容量至少为7而非保证恰为7。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#365d88"/></marker></defs>
<rect width="800" height="455" fill="#f7f9fc"/><g font-family="system-ui, PingFang SC, sans-serif"><text x="28" y="38" font-size="23" fill="#25364a" font-weight="650">元素已经存在，才可以访问</text><text x="28" y="68" font-size="16" fill="#25364a" >延续正文的同一个 vector；这里只画出至少预留的 7 个位置。</text><text x="28" y="142" font-size="18" fill="#25364a" >reserve(7)</text><text x="28" y="169" font-size="15" fill="#25364a" >size = 0</text><rect x="234" y="108" width="60" height="54" rx="8" fill="#f7f9fc" stroke="#aab7c8" stroke-dasharray="5 4"/><rect x="304" y="108" width="60" height="54" rx="8" fill="#f7f9fc" stroke="#aab7c8" stroke-dasharray="5 4"/><rect x="374" y="108" width="60" height="54" rx="8" fill="#f7f9fc" stroke="#aab7c8" stroke-dasharray="5 4"/><rect x="444" y="108" width="60" height="54" rx="8" fill="#f7f9fc" stroke="#aab7c8" stroke-dasharray="5 4"/><rect x="514" y="108" width="60" height="54" rx="8" fill="#f7f9fc" stroke="#aab7c8" stroke-dasharray="5 4"/><rect x="584" y="108" width="60" height="54" rx="8" fill="#f7f9fc" stroke="#aab7c8" stroke-dasharray="5 4"/><rect x="654" y="108" width="60" height="54" rx="8" fill="#f7f9fc" stroke="#aab7c8" stroke-dasharray="5 4"/><text x="746" y="143" font-size="22" fill="#25364a" >…</text><text x="28" y="232" font-size="18" fill="#25364a" >push_back(18)</text><text x="28" y="259" font-size="15" fill="#25364a" >size = 1</text><rect x="234" y="198" width="60" height="54" rx="8" fill="#dce9f7" stroke="#7996b9"/><text x="264" y="233" font-size="23" fill="#25364a" text-anchor="middle">18</text><rect x="304" y="198" width="60" height="54" rx="8" fill="#f7f9fc" stroke="#aab7c8" stroke-dasharray="5 4"/><rect x="374" y="198" width="60" height="54" rx="8" fill="#f7f9fc" stroke="#aab7c8" stroke-dasharray="5 4"/><rect x="444" y="198" width="60" height="54" rx="8" fill="#f7f9fc" stroke="#aab7c8" stroke-dasharray="5 4"/><rect x="514" y="198" width="60" height="54" rx="8" fill="#f7f9fc" stroke="#aab7c8" stroke-dasharray="5 4"/><rect x="584" y="198" width="60" height="54" rx="8" fill="#f7f9fc" stroke="#aab7c8" stroke-dasharray="5 4"/><rect x="654" y="198" width="60" height="54" rx="8" fill="#f7f9fc" stroke="#aab7c8" stroke-dasharray="5 4"/><text x="746" y="233" font-size="22" fill="#25364a" >…</text><text x="28" y="322" font-size="18" fill="#25364a" >resize(3)</text><text x="28" y="349" font-size="15" fill="#25364a" >size = 3</text><rect x="234" y="288" width="60" height="54" rx="8" fill="#dce9f7" stroke="#7996b9"/><text x="264" y="323" font-size="23" fill="#25364a" text-anchor="middle">18</text><rect x="304" y="288" width="60" height="54" rx="8" fill="#dce9f7" stroke="#7996b9"/><text x="334" y="323" font-size="23" fill="#25364a" text-anchor="middle">0</text><rect x="374" y="288" width="60" height="54" rx="8" fill="#dce9f7" stroke="#7996b9"/><text x="404" y="323" font-size="23" fill="#25364a" text-anchor="middle">0</text><rect x="444" y="288" width="60" height="54" rx="8" fill="#f7f9fc" stroke="#aab7c8" stroke-dasharray="5 4"/><rect x="514" y="288" width="60" height="54" rx="8" fill="#f7f9fc" stroke="#aab7c8" stroke-dasharray="5 4"/><rect x="584" y="288" width="60" height="54" rx="8" fill="#f7f9fc" stroke="#aab7c8" stroke-dasharray="5 4"/><rect x="654" y="288" width="60" height="54" rx="8" fill="#f7f9fc" stroke="#aab7c8" stroke-dasharray="5 4"/><text x="746" y="323" font-size="22" fill="#25364a" >…</text><text x="28" y="393" font-size="17" fill="#25364a" >实心格：已有 int 元素。虚线格：预留空间，不是可读元素。</text><text x="28" y="425" font-size="17" fill="#25364a" >三步之后容量均至少为 7；实际 capacity() 可以更大。</text></g></svg>