<svg xmlns="http://www.w3.org/2000/svg" width="900" height="455" viewBox="0 0 900 455" role="img" aria-labelledby="title desc"><title id="title">两份目标文件共同完成链接</title><desc id="desc">math.hpp的声明分别进入main.cpp和math.cpp。main.cpp编译为需要twice实现的main.o，math.cpp编译为提供定义的math.o。链接二者得到demo，运行输出6。</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#233b42} .title{font-size:25px;font-weight:650} .label{font-size:21px} .small{font-size:18px} .mono{font-family:monospace;font-size:20px} .line{fill:none;stroke:#477e80;stroke-width:2.4;marker-end:url(#arrow)} .soft{fill:#eef5f1;stroke:#91b3a6;stroke-width:1.5} .box{fill:#fffef9;stroke:#98adae;stroke-width:1.5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#477e80"/></marker></defs><rect width="900" height="455" rx="16" fill="#f8f7f1"/><text x="30" y="42" class="title" text-anchor="start">声明让调用可编译，实现还必须参与链接</text><rect x="290" y="70" width="300" height="65" rx="12" class="box"/><text x="440.0" y="102" class="mono" text-anchor="middle">math.hpp: twice(int);</text><path d="M350 135 V160 H150 V183" class="line"/><path d="M290 102 H20 V290 H150 V313" class="line"/><rect x="40" y="195" width="185" height="65" rx="12" class="box"/><text x="132.5" y="227" class="mono" text-anchor="middle">main.cpp</text><path d="M225 228 H275" class="line"/><rect x="290" y="195" width="185" height="65" rx="12" class="box"/><text x="382.5" y="227" class="mono" text-anchor="middle">main.o</text><text x="382" y="286" class="small" text-anchor="middle">调用 twice，等待实现</text><rect x="40" y="325" width="185" height="65" rx="12" class="box"/><text x="132.5" y="357" class="mono" text-anchor="middle">math.cpp</text><path d="M225 358 H275" class="line"/><rect x="290" y="325" width="185" height="65" rx="12" class="box"/><text x="382.5" y="357" class="mono" text-anchor="middle">math.o</text><text x="382" y="416" class="small" text-anchor="middle">提供 twice 的定义</text><text x="257" y="183" class="small" text-anchor="middle">编译</text><text x="257" y="313" class="small" text-anchor="middle">编译</text><path d="M475 228 H560 V283 H635" class="line"/><path d="M475 358 H560 V313 H635" class="line"/><rect x="650" y="263" width="200" height="80" rx="12" class="soft"/><text x="750.0" y="295" class="mono" text-anchor="middle">demo</text><text x="750.0" y="321" class="small" text-anchor="middle">链接两个目标文件</text><text x="750" y="405" class="mono" text-anchor="middle">运行 ./demo → 6</text></svg>
