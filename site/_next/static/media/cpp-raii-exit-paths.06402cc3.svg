<svg xmlns="http://www.w3.org/2000/svg" width="900" height="385" viewBox="0 0 900 385" role="img" aria-labelledby="title desc"><title id="title">正常退出与异常传播中的资源清理</title><desc id="desc">正常离开作用域时先释放资源再输出after scope；异常传播时先在栈展开中释放资源，再进入catch输出caught。</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#233b42} .title{font-size:25px;font-weight:650} .label{font-size:21px} .small{font-size:18px} .mono{font-family:monospace;font-size:20px} .line{fill:none;stroke:#477e80;stroke-width:2.4;marker-end:url(#arrow)} .soft{fill:#eef5f1;stroke:#91b3a6;stroke-width:1.5} .box{fill:#fffef9;stroke:#98adae;stroke-width:1.5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#477e80"/></marker></defs><rect width="900" height="385" rx="16" fill="#f8f7f1"/><text x="30" y="45" class="title" text-anchor="start">资源已被管理之后，比较两条退出路径</text><text x="30" y="105" class="label" text-anchor="start">正常退出</text><rect x="175" y="70" width="180" height="80" rx="12" class="box"/><text x="265.0" y="102" class="mono" text-anchor="middle">scope ends</text><text x="265.0" y="128" class="small" text-anchor="middle">离开内层作用域</text><path d="M355 110 H415" class="line"/><rect x="430" y="70" width="180" height="80" rx="12" class="soft"/><text x="520.0" y="102" class="mono" text-anchor="middle">released</text><text x="520.0" y="128" class="small" text-anchor="middle">析构并释放资源</text><path d="M610 110 H670" class="line"/><rect x="685" y="70" width="185" height="80" rx="12" class="box"/><text x="777.5" y="102" class="mono" text-anchor="middle">after scope</text><text x="30" y="245" class="label" text-anchor="start">异常传播</text><rect x="175" y="210" width="180" height="80" rx="12" class="box"/><text x="265.0" y="242" class="mono" text-anchor="middle">throw</text><text x="265.0" y="268" class="small" text-anchor="middle">进入栈展开</text><path d="M355 250 H415" class="line"/><rect x="430" y="210" width="180" height="80" rx="12" class="soft"/><text x="520.0" y="242" class="mono" text-anchor="middle">released</text><text x="520.0" y="268" class="small" text-anchor="middle">清理局部管理者</text><path d="M610 250 H670" class="line"/><rect x="685" y="210" width="185" height="80" rx="12" class="box"/><text x="777.5" y="242" class="mono" text-anchor="middle">caught</text><text x="777.5" y="268" class="small" text-anchor="middle">再进入外层 catch</text><text x="450" y="350" class="small" text-anchor="middle">对应两段独立示例；强制终止不属于这里的正常退出或异常栈展开。</text></svg>
