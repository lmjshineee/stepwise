<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="title desc">
<title id="title">单参数模型的一次训练更新</title><desc id="desc">输入和参数产生预测，预测与目标比较形成损失，链式法则算得梯度负4，优化器按学习率0.1把参数从1更新到1.4。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#365d88"/></marker></defs>
<rect width="800" height="430" fill="#f7f9fc"/><g font-family="system-ui, PingFang SC, sans-serif"><text x="28" y="38" font-size="23" fill="#25364a" font-weight="650">一次更新：先评价，再调整参数</text><text x="28" y="68" font-size="16" fill="#25364a" >教学样本 x = 2、y = 4；初始参数 w = 1；学习率 η = 0.1。</text><rect x="28" y="105" width="170" height="96" rx="8" fill="#edf2f8" stroke="#7996b9"/><text x="113" y="137" font-size="18" fill="#25364a" text-anchor="middle">输入与参数</text><text x="113" y="174" font-size="15" fill="#25364a" text-anchor="middle">x = 2，w = 1</text><path d="M199 153 H215" fill="none" stroke="#365d88" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="223" y="105" width="170" height="96" rx="8" fill="#edf2f8" stroke="#7996b9"/><text x="308" y="137" font-size="18" fill="#25364a" text-anchor="middle">预测</text><text x="308" y="174" font-size="15" fill="#25364a" text-anchor="middle">ŷ = wx = 2</text><path d="M394 153 H410" fill="none" stroke="#365d88" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="418" y="105" width="170" height="96" rx="8" fill="#edf2f8" stroke="#7996b9"/><text x="503" y="137" font-size="18" fill="#25364a" text-anchor="middle">比较目标</text><text x="503" y="174" font-size="15" fill="#25364a" text-anchor="middle">ŷ − y = −2</text><path d="M589 153 H605" fill="none" stroke="#365d88" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="613" y="105" width="170" height="96" rx="8" fill="#edf2f8" stroke="#7996b9"/><text x="698" y="137" font-size="18" fill="#25364a" text-anchor="middle">损失</text><text x="698" y="174" font-size="15" fill="#25364a" text-anchor="middle">L = ½(ŷ − y)² = 2</text><path d="M698 203 V245 H515" fill="none" stroke="#365d88" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="300" y="220" width="205" height="94" rx="8" fill="#e3efe8" stroke="#7996b9"/><text x="402" y="252" font-size="17" fill="#25364a" text-anchor="middle">求导（链式法则）</text><text x="402" y="290" font-size="18" fill="#25364a" text-anchor="middle">g = (wx − y)x = −4</text><path d="M298 267 H252" fill="none" stroke="#365d88" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="28" y="220" width="214" height="94" rx="8" fill="#dce9f7" stroke="#7996b9"/><text x="135" y="252" font-size="18" fill="#25364a" text-anchor="middle">更新参数</text><text x="135" y="290" font-size="18" fill="#25364a" text-anchor="middle">w ← w − ηg = 1.4</text><text x="28" y="361" font-size="18" fill="#25364a" >用新参数再算一次：预测为 2.8，损失为 0.72。</text><text x="28" y="397" font-size="17" fill="#25364a" >目标 y 没变；改变的是 w。新一轮会重新计算预测、损失与梯度。</text></g></svg>