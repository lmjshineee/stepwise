<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
<title id="title">按行和按列的缓存访问轨迹</title><desc id="desc">左侧是按行存储的下标0到15。按行前四步都访问L0，按列依次访问L0到L3。单缓存行模型走完矩阵分别未命中4次和16次。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#365d88"/></marker></defs>
<rect width="800" height="450" fill="#f7f9fc"/><g font-family="system-ui, PingFang SC, sans-serif"><text x="28" y="38" font-size="23" fill="#25364a" font-weight="650">同一个 4×4 矩阵，两种访问顺序</text><text x="28" y="68" font-size="16" fill="#25364a" >模型：每条缓存行 4 个元素；只保留一条行；对齐且初始为空。</text><text x="30" y="134" font-size="17" fill="#25364a" >L0</text><rect x="72" y="104" width="47" height="45" rx="8" fill="#dce9f7" stroke="#7996b9"/><text x="95" y="133" font-size="18" fill="#25364a" text-anchor="middle">0</text><rect x="123" y="104" width="47" height="45" rx="8" fill="#dce9f7" stroke="#7996b9"/><text x="146" y="133" font-size="18" fill="#25364a" text-anchor="middle">1</text><rect x="174" y="104" width="47" height="45" rx="8" fill="#dce9f7" stroke="#7996b9"/><text x="197" y="133" font-size="18" fill="#25364a" text-anchor="middle">2</text><rect x="225" y="104" width="47" height="45" rx="8" fill="#dce9f7" stroke="#7996b9"/><text x="248" y="133" font-size="18" fill="#25364a" text-anchor="middle">3</text><text x="30" y="185" font-size="17" fill="#25364a" >L1</text><rect x="72" y="155" width="47" height="45" rx="8" fill="#e3efe8" stroke="#7996b9"/><text x="95" y="184" font-size="18" fill="#25364a" text-anchor="middle">4</text><rect x="123" y="155" width="47" height="45" rx="8" fill="#e3efe8" stroke="#7996b9"/><text x="146" y="184" font-size="18" fill="#25364a" text-anchor="middle">5</text><rect x="174" y="155" width="47" height="45" rx="8" fill="#e3efe8" stroke="#7996b9"/><text x="197" y="184" font-size="18" fill="#25364a" text-anchor="middle">6</text><rect x="225" y="155" width="47" height="45" rx="8" fill="#e3efe8" stroke="#7996b9"/><text x="248" y="184" font-size="18" fill="#25364a" text-anchor="middle">7</text><text x="30" y="236" font-size="17" fill="#25364a" >L2</text><rect x="72" y="206" width="47" height="45" rx="8" fill="#fff0d7" stroke="#7996b9"/><text x="95" y="235" font-size="18" fill="#25364a" text-anchor="middle">8</text><rect x="123" y="206" width="47" height="45" rx="8" fill="#fff0d7" stroke="#7996b9"/><text x="146" y="235" font-size="18" fill="#25364a" text-anchor="middle">9</text><rect x="174" y="206" width="47" height="45" rx="8" fill="#fff0d7" stroke="#7996b9"/><text x="197" y="235" font-size="18" fill="#25364a" text-anchor="middle">10</text><rect x="225" y="206" width="47" height="45" rx="8" fill="#fff0d7" stroke="#7996b9"/><text x="248" y="235" font-size="18" fill="#25364a" text-anchor="middle">11</text><text x="30" y="287" font-size="17" fill="#25364a" >L3</text><rect x="72" y="257" width="47" height="45" rx="8" fill="#f0e4f4" stroke="#7996b9"/><text x="95" y="286" font-size="18" fill="#25364a" text-anchor="middle">12</text><rect x="123" y="257" width="47" height="45" rx="8" fill="#f0e4f4" stroke="#7996b9"/><text x="146" y="286" font-size="18" fill="#25364a" text-anchor="middle">13</text><rect x="174" y="257" width="47" height="45" rx="8" fill="#f0e4f4" stroke="#7996b9"/><text x="197" y="286" font-size="18" fill="#25364a" text-anchor="middle">14</text><rect x="225" y="257" width="47" height="45" rx="8" fill="#f0e4f4" stroke="#7996b9"/><text x="248" y="286" font-size="18" fill="#25364a" text-anchor="middle">15</text><text x="330" y="124" font-size="18" fill="#25364a" >按行的前四步：0 → 1 → 2 → 3</text><rect x="330" y="145" width="86" height="45" rx="8" fill="#dce9f7" stroke="#7996b9"/><text x="373" y="174" font-size="18" fill="#25364a" text-anchor="middle">L0</text><rect x="428" y="145" width="86" height="45" rx="8" fill="#dce9f7" stroke="#7996b9"/><text x="471" y="174" font-size="18" fill="#25364a" text-anchor="middle">L0</text><rect x="526" y="145" width="86" height="45" rx="8" fill="#dce9f7" stroke="#7996b9"/><text x="569" y="174" font-size="18" fill="#25364a" text-anchor="middle">L0</text><rect x="624" y="145" width="86" height="45" rx="8" fill="#dce9f7" stroke="#7996b9"/><text x="667" y="174" font-size="18" fill="#25364a" text-anchor="middle">L0</text><text x="330" y="219" font-size="18" fill="#25364a" >按列的前四步：0 → 4 → 8 → 12</text><rect x="330" y="240" width="86" height="45" rx="8" fill="#dce9f7" stroke="#7996b9"/><text x="373" y="269" font-size="18" fill="#25364a" text-anchor="middle">L0</text><rect x="428" y="240" width="86" height="45" rx="8" fill="#e3efe8" stroke="#7996b9"/><text x="471" y="269" font-size="18" fill="#25364a" text-anchor="middle">L1</text><rect x="526" y="240" width="86" height="45" rx="8" fill="#fff0d7" stroke="#7996b9"/><text x="569" y="269" font-size="18" fill="#25364a" text-anchor="middle">L2</text><rect x="624" y="240" width="86" height="45" rx="8" fill="#f0e4f4" stroke="#7996b9"/><text x="667" y="269" font-size="18" fill="#25364a" text-anchor="middle">L3</text><text x="28" y="347" font-size="17" fill="#25364a" >按行：第一次装入后连续复用，读完 16 个元素共 4 次未命中。</text><text x="28" y="382" font-size="17" fill="#25364a" >按列：每次换行都会替换，读完 16 个元素共 16 次未命中。</text><text x="28" y="418" font-size="17" fill="#25364a" >这是缓存模型的访问计数，不能据此推出真实程序慢四倍。</text></g></svg>