<svg xmlns="http://www.w3.org/2000/svg" width="900" height="475" viewBox="0 0 900 475" role="img" aria-labelledby="title desc"><title id="title">绑定引用与移动所有权是两步</title><desc id="desc">上图candidate只给owner增加别名，owner仍拥有42。下图构造next后，owner为空，candidate仍引用owner，next拥有原来的整数42。</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#233b42} .title{font-size:25px;font-weight:650} .label{font-size:21px} .small{font-size:18px} .mono{font-family:monospace;font-size:20px} .line{fill:none;stroke:#477e80;stroke-width:2.4;marker-end:url(#arrow)} .soft{fill:#eef5f1;stroke:#91b3a6;stroke-width:1.5} .box{fill:#fffef9;stroke:#98adae;stroke-width:1.5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#477e80"/></marker></defs><rect width="900" height="475" rx="16" fill="#f8f7f1"/><text x="30" y="45" class="title" text-anchor="start">① 绑定 candidate 后：只有一个管理对象</text><text x="30" y="82" class="mono" text-anchor="start">auto&amp;&amp; candidate = std::move(owner);</text><text x="45" y="155" class="mono" text-anchor="start">candidate</text><path d="M165 148 H285" class="line"/><rect x="300" y="110" width="240" height="80" rx="12" class="soft"/><text x="420.0" y="142" class="mono" text-anchor="middle">owner</text><text x="420.0" y="168" class="small" text-anchor="middle">unique_ptr，仍拥有资源</text><path d="M540 150 H705" class="line"/><rect x="720" y="118" width="140" height="65" rx="12" class="box"/><text x="790.0" y="150" class="mono" text-anchor="middle">42</text><text x="30" y="250" class="title" text-anchor="start">② 构造 next 后：责任才交给新管理对象</text><text x="30" y="287" class="mono" text-anchor="start">auto next = std::move(candidate);</text><text x="35" y="365" class="mono" text-anchor="start">candidate</text><path d="M155 357 H220" class="line"/><rect x="235" y="320" width="185" height="80" rx="12" class="box"/><text x="327.5" y="352" class="mono" text-anchor="middle">owner</text><text x="327.5" y="378" class="small" text-anchor="middle">空，仍然存活</text><rect x="485" y="320" width="185" height="80" rx="12" class="soft"/><text x="577.5" y="352" class="mono" text-anchor="middle">next</text><text x="577.5" y="378" class="small" text-anchor="middle">接管原资源</text><path d="M670 360 H730" class="line"/><rect x="745" y="328" width="125" height="65" rx="12" class="box"/><text x="807.5" y="360" class="mono" text-anchor="middle">42</text><text x="450" y="445" class="small" text-anchor="middle">两行是不同执行时刻；整数没有被复制，candidate 始终引用 owner。</text></svg>
